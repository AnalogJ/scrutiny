<h2 mat-dialog-title>Device Settings</h2>
<mat-dialog-content class="mat-typography">

    <form class="flex flex-col p-8 pb-0 ">
        <div class="flex flex-col">
            <mat-form-field class="w-full">
                <mat-label>Friendly Name</mat-label>
                <input matInput name="friendlyName" [(ngModel)]="friendlyName">
            </mat-form-field>
        </div>
    </form>

</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cancel</button>
    <button mat-button (click)="saveSettings()" cdkFocusInitial>Save</button>
</mat-dialog-actions>
