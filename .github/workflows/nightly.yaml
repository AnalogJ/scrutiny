name: Nightly
on:
  workflow_dispatch:
  # Note: this only runs on the default branch
  schedule:
    - cron: '36 12 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build_nightlies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: "Populate frontend version information"
        run: "cd webapp/frontend && ./git.version.sh"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for omnibus
        id: meta_omnibus
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=raw,enable=true,value=nightly,suffix=-omnibus
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push omnibus Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta_omnibus.outputs.tags }}
          labels: ${{ steps.meta_omnibus.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for collector
        id: meta_collector
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=raw,enable=true,value=nightly,suffix=-collector
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push collector Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile.collector
          push: true
          tags: ${{ steps.meta_collector.outputs.tags }}
          labels: ${{ steps.meta_collector.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for web
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=raw,enable=true,value=nightly,suffix=-web
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push web Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build_frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    container: node:lts-slim
    permissions:
      contents: read
    steps:
      - name: Git
        run: |
          apt-get update && apt-get install -y git make
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build Frontend
        env:
          # the node:lts-slim image has no en_US.UTF-8 locale generated, and the
          # runner injects LANG/LC_ALL=en_US.UTF-8 into every step regardless
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          (cd webapp/frontend && ./git.version.sh)
          make binary-frontend
          tar -czf scrutiny-web-frontend.tar.gz dist
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: scrutiny-web-frontend
          path: scrutiny-web-frontend.tar.gz
          retention-days: 1

  build_deb:
    name: Build Debian packages (${{ matrix.cfg.arch }})
    needs: build_frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        cfg:
          - { arch: amd64, goarch: amd64 }
          - { arch: armel, goarch: arm,   goarm: 5 }
          - { arch: armhf, goarch: arm,   goarm: 7 }
          - { arch: arm64, goarch: arm64 }
    env:
      GOARCH: ${{ matrix.cfg.goarch }}
      GOARM: ${{ matrix.cfg.goarm }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download frontend
        uses: actions/download-artifact@v7
        with:
          name: scrutiny-web-frontend
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build Debian packages
        run: |
          tar -xzf scrutiny-web-frontend.tar.gz
          make package-deb-collector package-deb-web NIGHTLY=1
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: scrutiny-nightly-deb-${{ matrix.cfg.arch }}
          path: |
            scrutiny-collector_${{ matrix.cfg.arch }}.deb
            scrutiny-web_${{ matrix.cfg.arch }}.deb
          if-no-files-found: error
