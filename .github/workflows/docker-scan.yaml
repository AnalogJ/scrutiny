name: Docker - Vulnerability Scan
on:
  workflow_dispatch:
  # New CVEs land against unchanged images, so scan published images daily
  # rather than only at build time.
  schedule:
    - cron: '17 14 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [latest-omnibus, latest-collector, latest-web, nightly-omnibus, nightly-collector, nightly-web]

    steps:
      - name: Scan image
        id: scan
        # Pinned by SHA: third-party scanner with access to the security-events token.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ghcr.io/analogj/scrutiny:${{ matrix.image }}
          fail-build: false
          # Debian carries many CVEs with no fix available; report only actionable ones.
          only-fixed: true
      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: ${{ matrix.image }}
