version: 2
updates:
  - package-ecosystem: npm
    directory: /webapp/frontend
    schedule:
      interval: weekly
    # Security updates only; 0 disables routine version-bump PRs.
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  # Backend and collector share the root Go module.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      go-security:
        applies-to: security-updates
        patterns: ["*"]
